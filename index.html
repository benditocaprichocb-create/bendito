<!-- Nota: la tipografía de marca (LEMON MiLK / Mont) no está disponible en Google Fonts.
     Se usa Poppins como reemplazo más cercano: geométrica y de peso similar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    /* Paleta oficial Bendito Capricho */
    --negro:#000000;
    --vino:#9d0320;
    --dorado:#d8c290;
    --dorado-texto:#8a6e34;
    --gris:#7b7d82;
    --gris-claro:#e7e8ea;

    --paper:#FFFFFF;
    --paper-edge:#e7e8ea;
    --ink:#000000;
    --ink-soft:#7b7d82;
    --stamp-red:#9d0320;
    --stamp-green:#9d0320;
    --stamp-amber:#8a6e34;
    --line:#e7e8ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:var(--gris-claro);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px 12px 50px;
  }
  .wrap{width:100%;max-width:420px;}
  .eyebrow{
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:900;
    font-size:22px;
    line-height:1.15;
    margin:0 0 22px;
    letter-spacing:.01em;
  }

  .ticket{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow: 0 1px 0 #fff inset, 0 18px 40px -22px rgba(0,0,0,.35);
    padding:26px 22px 22px;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:9px;
    background-image: radial-gradient(circle, var(--paper) 4.2px, transparent 4.3px);
    background-size: 16px 16px;
    background-position: 0 -4px;
  }
  .ticket::before{ top:-5px; }
  .ticket::after{ bottom:-5px; transform:rotate(180deg); }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  select, input[type=date]{
    width:100%;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:11px 10px;
    background:#fff;
    border:1.5px solid var(--ink);
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    border-radius:0;
  }
  select{
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 12px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat:no-repeat;
  }

  .daynav{
    display:flex; align-items:stretch; gap:8px;
  }
  .daynav button{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:18px;
    width:46px;
    min-height:44px;
    background:#fff;
    border:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
  }
  .daynav button:active{ background:var(--ink); color:var(--paper); }
  .daynav input[type=date]{ flex:1; text-align:center; }

  .divider{
    border:none; border-top:1px dashed var(--line);
    margin:20px 0;
  }

  .datelabel{
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:16px;
  }

  .stampzone{
    display:flex;
    justify-content:center;
    padding:10px 0 18px;
    min-height:118px;
    align-items:center;
  }
  .stamp{
    border:3px solid var(--stamp-green);
    color:var(--stamp-green);
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:22px;
    line-height:1.25;
    text-align:center;
    padding:14px 18px;
    transform:rotate(-3deg) scale(1);
    letter-spacing:.02em;
    text-transform:uppercase;
    animation: stampdown .28s cubic-bezier(.2,1.4,.4,1);
    max-width:100%;
  }
  .stamp.libre{
    border-color:var(--stamp-amber);
    color:var(--stamp-amber);

  .stamp.outofrange, .stamp.loading, .stamp.error{

    color:var(--ink-soft);
    font-size:14px;
    font-family:'Poppins', sans-serif;

    transform:rotate(0deg);
    line-height:1.5;

  @keyframes stampdown{
    0%{ transform:rotate(-3deg) scale(1.6); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:rotate(-3deg) scale(1); opacity:1; }
  }

  .team{ margin-top:4px; }
  .team-title{
    display:flex; align-items:baseline; justify-content:space-between;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;

  .row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dotted var(--line);
    font-size:13px;

  .row:last-child{ border-bottom:none; }
  .row .name{ font-weight:700; }
  .row.me{ color:var(--stamp-red); }
  .row .role{ text-align:right; color:var(--ink-soft); }
  .row.me .role{ color:var(--stamp-red); font-weight:700; }

  .footer{
    text-align:center;
    margin-top:22px;
    font-family:'Poppins', sans-serif;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:.06em;
  }
  .refresh{
    display:block;

    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    padding:10px 16px;

  .refresh:active{ background:var(--ink-soft); color:var(--paper); }

  .setup{

    font-size:11px;
    line-height:1.6;
    color:var(--ink-soft);
    text-align:left;
  }
  .setup b{ color:var(--ink); }
  .setup ol{ padding-left:18px; margin:8px 0; }

  .tabs{
    display:flex;
    margin-bottom:18px;
    border:1.5px solid var(--ink);
  }
  .tabs button{
    flex:1;
    background:#fff;
    border:none;
    font-family:'Poppins', sans-serif;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    padding:13px 4px;
    min-height:44px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tabs button:not(:last-child){ border-right:1.5px solid var(--ink); }
  .tabs button.active{ background:var(--ink); color:var(--paper); }

  .view.hidden{ display:none; }

  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-head button{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:18px;
    width:42px;
    min-height:44px;
    background:#fff;
    border:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
  }
  .cal-head button:active{ background:var(--ink); color:var(--paper); }
  .cal-head .monthlabel{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:.02em;
    text-transform:uppercase;
    text-align:center;
    flex:1;
  }
  .calgrid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .calgrid .dow{
    font-family:'Poppins', sans-serif;
    font-size:9px;
    text-align:center;
    color:var(--ink-soft);
    letter-spacing:.03em;
    padding-bottom:4px;
  }
  .calgrid .day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    font-size:12px;
    font-weight:700;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
  }
  .calgrid .day.empty{ border:none; background:transparent; }
  .calgrid .day.libre{
    background:var(--stamp-amber);
    border-color:var(--stamp-amber);
    color:#fff;
  }
  .calgrid .day.today{ outline:2px solid var(--stamp-red); outline-offset:-2px; }

  .cal-legend{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'Poppins', sans-serif;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:14px;
  }
  .cal-legend .swatch{
    width:12px; height:12px;
    background:var(--stamp-amber);
    display:inline-block;
    border:1px solid var(--stamp-amber);

  @media (prefers-reduced-motion: reduce){
    .stamp{ animation:none; }
  }

  .pw-submit{
    width:100%;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    background:var(--vino);
    color:#fff;
    border:none;
    padding:13px 10px;
    min-height:46px;
    cursor:pointer;
    margin-top:6px;
  }
  .pw-submit:active{ opacity:.85; }
  .pw-error{
    font-family:'Poppins', sans-serif;
    font-size:12px;
    color:var(--vino);
    margin:-6px 0 10px;
  }
  .pw-error.hidden{ display:none; }
  .pw-hint{
    font-family:'Poppins', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:14px;
    min-height:14px;
  }
  .hidden{ display:none !important; }
  #gate.hidden{ display:none; }
</style>

<body>
<div class="wrap">

    <div class="team">

  <div class="footer" id="footer">Fuente: Google Sheets (hoja publicada)</div>
</div>

<script>
/* ============================================================
   CONEXIÓN CON GOOGLE DRIVE
   ============================================================
   Esta comanda lee en vivo la hoja "Cronograma cocina unificada
   (ago-dic 2026)" creada en tu Google Drive. El enlace usa el
   export CSV directo de Google Sheets (sin necesidad de
   "Publicar en la web").
   IMPORTANTE: para que cargue desde cualquier celular, la hoja
   debe estar compartida como "Cualquiera con el enlace - Lector".
   Ábrela aquí: https://docs.google.com/spreadsheets/d/1gv2s28UopnHt-L4RmQyDKYiJpdtV6eNAMlK0EafmH94/edit
   y revisa el botón "Compartir" arriba a la derecha.
   Cada vez que edites una celda en esa hoja, esta página lo
   refleja al instante (no hay que republicar nada).
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1gv2s28UopnHt-L4RmQyDKYiJpdtV6eNAMlK0EafmH94/gviz/tq?tqx=out:csv&gid=0";

/* ============================================================
   CONTRASEÑA DE ACCESO
   ============================================================
   La contraseña se lee de la primera celda con contenido en una
   pestaña llamada "Config" en la misma hoja de Google. Para
   cambiarla, solo edita esa celda — no hace falta tocar este
   archivo.
   IMPORTANTE: esto NO es seguridad real (cualquiera con algo de
   conocimiento técnico puede ver el valor en el CSV público). Es
   solo una pantalla para que el link no se abra por accidente si
   circula fuera del equipo.
   ============================================================ */
const CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/1gv2s28UopnHt-L4RmQyDKYiJpdtV6eNAMlK0EafmH94/gviz/tq?tqx=out:csv&sheet=Config";

const gateEl = document.getElementById('gate');
const appContentEl = document.getElementById('appContent');
const pwInput = document.getElementById('pwInput');
const pwError = document.getElementById('pwError');
const pwHint = document.getElementById('pwHint');
const pwSubmit = document.getElementById('pwSubmit');

let REQUIRED_PASSWORD = null;

function loadPassword(){
  pwHint.textContent = 'Verificando…';
  Papa.parse(CONFIG_CSV_URL, {
    download: true,
    complete: function(results){
      const rows = results.data;
      REQUIRED_PASSWORD = null;
      for(const row of rows){
        if(row && row[0] && String(row[0]).trim() !== ''){
          REQUIRED_PASSWORD = String(row[0]).trim();
          break;
        }
      }
      pwHint.textContent = '';
      if(!REQUIRED_PASSWORD){
        pwHint.textContent = 'No se encontró una contraseña configurada en la hoja "Config".';
      }
    },
    error: function(){
      pwHint.textContent = 'No se pudo verificar la contraseña. Revisa tu conexión e intenta de nuevo.';
    }
  });
}

function tryUnlock(){
  const val = pwInput.value.trim();
  if(REQUIRED_PASSWORD === null){
    pwHint.textContent = 'Todavía estamos verificando, espera un segundo e intenta de nuevo.';
    return;
  }
  if(val !== '' && val === REQUIRED_PASSWORD){
    gateEl.classList.add('hidden');
    appContentEl.classList.remove('hidden');
    loadSchedule();
  } else {
    pwError.classList.remove('hidden');
    pwInput.value = '';
    pwInput.focus();
  }
}

pwSubmit.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
  pwError.classList.add('hidden');
});
loadPassword();

const NON_PERSON_COLUMNS = ["Fecha","Día","Total en turno"];
let PEOPLE = [];        // se llena automáticamente desde los encabezados de la hoja

let SCHEDULE = {};      // "YYYY-MM-DD" -> { Kelly:"TURNO", ... , total:"4" }
let DATES = [];         // sorted list of "YYYY-MM-DD" available in the sheet
let LOADED = false;

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }

const DIA_ES = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

// Accepts "2026-08-24", "8/24/2026", "24/08/2026" and returns "YYYY-MM-DD" or null
function parseFlexibleDate(raw){
  if(!raw) return null;
  raw = String(raw).trim();
  let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){
    // ambiguous M/D vs D/M — Google's US locale CSV export uses M/D/YYYY
    return `${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
  }
  const d = new Date(raw);
  if(!isNaN(d)) return toISO(d);
  return null;
}

const cookSel = document.getElementById('cook');
const cookCalSel = document.getElementById('cookCal');

const dateInput = document.getElementById('datein');
const stampzone = document.getElementById('stampzone');
const daylabel = document.getElementById('daylabel');
const teamlist = document.getElementById('teamlist');
const totalturno = document.getElementById('totalturno');
const footer = document.getElementById('footer');

const tabTurnoBtn = document.getElementById('tabTurnoBtn');
const tabDescansosBtn = document.getElementById('tabDescansosBtn');
const viewTurno = document.getElementById('viewTurno');
const viewDescansos = document.getElementById('viewDescansos');
const monthlabel = document.getElementById('monthlabel');
const calgrid = document.getElementById('calgrid');

let calYear = null, calMonth = null; // calMonth: 0-11

tabTurnoBtn.addEventListener('click', ()=>{
  tabTurnoBtn.classList.add('active');
  tabDescansosBtn.classList.remove('active');
  viewTurno.classList.remove('hidden');
  viewDescansos.classList.add('hidden');
});
tabDescansosBtn.addEventListener('click', ()=>{
  tabDescansosBtn.classList.add('active');
  tabTurnoBtn.classList.remove('active');
  viewDescansos.classList.remove('hidden');
  viewTurno.classList.add('hidden');
  if(LOADED) renderCalendar();
});

function showMessage(cls, html){
  stampzone.innerHTML = `<div class="stamp ${cls}">${html}</div>`;
  teamlist.innerHTML = '';
  totalturno.textContent = '';
}

function showSetupInstructions(){
  daylabel.textContent = '—';
  stampzone.innerHTML = `<div class="stamp error" style="text-align:left">
    <div class="setup">
      <b>Falta conectar la hoja de Google.</b>
      <ol>
        <li>Crea o pega el enlace de tu Google Sheet en la constante <b>SHEET_CSV_URL</b> dentro del archivo HTML.</li>
        <li>Asegúrate de que la hoja esté compartida como "Cualquiera con el enlace - Lector".</li>
      </ol>
    </div>
  </div>`;
  teamlist.innerHTML = '';
  totalturno.textContent = '';
}

function loadSchedule(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('PEGA_AQUI') !== -1){
    showSetupInstructions();
    return;
  }
  showMessage('loading', 'Cargando cronograma desde Google Sheets…');
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){
      try{
        const rows = results.data;
        const headerFields = results.meta.fields || [];
        PEOPLE = headerFields.filter(f => f && NON_PERSON_COLUMNS.indexOf(f) === -1);

        if(PEOPLE.length === 0){
          showMessage('error', 'No se encontraron columnas de personas en la hoja. Revisa los encabezados (Fecha, Día, nombres, Total en turno).');
          return;
        }

        const previousCook = cookSel.value;
        const previousCalCook = cookCalSel.value;
        cookSel.innerHTML = '';
        cookCalSel.innerHTML = '';
        PEOPLE.forEach(n=>{
          const opt = document.createElement('option');
          opt.value = n; opt.textContent = n;
          cookSel.appendChild(opt);
          const opt2 = document.createElement('option');
          opt2.value = n; opt2.textContent = n;
          cookCalSel.appendChild(opt2);
        });
        if(previousCook && PEOPLE.indexOf(previousCook) !== -1){
          cookSel.value = previousCook;
        }
        if(previousCalCook && PEOPLE.indexOf(previousCalCook) !== -1){
          cookCalSel.value = previousCalCook;
        }

        SCHEDULE = {};
        rows.forEach(r=>{
          const iso = parseFlexibleDate(r['Fecha']);
          if(!iso) return;
          const entry = { total: r['Total en turno'] || '' };
          PEOPLE.forEach(p=>{ entry[p] = (r[p] || '').trim().toUpperCase(); });
          SCHEDULE[iso] = entry;
        });
        DATES = Object.keys(SCHEDULE).sort();
        if(DATES.length === 0){
          showMessage('error', 'No se encontraron filas de fechas en la hoja. Revisa que la hoja publicada sea "Cronograma".');
          return;
        }
        LOADED = true;
        dateInput.min = DATES[0];
        dateInput.max = DATES[DATES.length-1];
        footer.textContent = `Cronograma vigente: ${DATES[0]} – ${DATES[DATES.length-1]} · datos en vivo desde Google Sheets`;
        if(!dateInput.value){
          const today = toISO(dateOnly(new Date()));
          dateInput.value = SCHEDULE[today] ? today : (today < DATES[0] ? DATES[0] : DATES[DATES.length-1]);
        }
        if(calYear === null){
          const [fy, fm] = dateInput.value.split('-').map(Number);
          calYear = fy; calMonth = fm - 1;
        }
        render();
        if(!viewDescansos.classList.contains('hidden')) renderCalendar();
      }catch(e){
        showMessage('error', 'No se pudo leer el formato de la hoja. Verifica los encabezados de columna.');
      }
    },
    error: function(){
      showMessage('error', 'No se pudo conectar con Google Sheets. Revisa que la hoja esté compartida como "Cualquiera con el enlace" y tu conexión a internet.');
    }
  });
}

function render(){
  if(!LOADED) return;
  const iso = dateInput.value;
  const who = cookSel.value;
  const d = new Date(iso + 'T00:00:00');

  const wdName = DIA_ES[(d.getDay()+6)%7];
  const fechaTxt = d.toLocaleDateString('es-CO', {day:'numeric', month:'long', year:'numeric'});
  daylabel.textContent = `${wdName} · ${fechaTxt}`;

  const entry = SCHEDULE[iso];
  if(!entry){
    showMessage('outofrange', `Esta fecha está fuera<br>del cronograma publicado<br>(${DATES[0]} – ${DATES[DATES.length-1]})`);
    return;
  }

  const myStatus = entry[who] || '—';
  const isLibre = myStatus === 'LIBRE';

  stampzone.innerHTML = '';
  const stamp = document.createElement('div');
  stamp.className = 'stamp' + (isLibre ? ' libre' : '');
  stamp.innerHTML = isLibre
    ? `LIBRE HOY<span class="sub">${who}</span>`
    : `${myStatus}<span class="sub"></span>Turno de ${who}</span>`;
  stampzone.appendChild(stamp);

  totalturno.textContent = entry.total ? `${entry.total} en turno` : '';

  teamlist.innerHTML = '';
  PEOPLE.forEach(name=>{
    const status = entry[name] || '—';
    const off = status === 'LIBRE';
    const row = document.createElement('div');
    row.className = 'row' + (name===who ? ' me' : '');
    row.innerHTML = `<span class="name">${name}</span><span class="role${off?' off':''}">${off ? 'Libre' : status}</span>`;
    teamlist.appendChild(row);
  });
}

const MES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DOW_ES = ["L","M","M","J","V","S","D"];

function renderCalendar(){
  if(!LOADED || calYear === null) return;
  const who = cookCalSel.value;
  monthlabel.textContent = `${MES_ES[calMonth]} ${calYear}`;

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7; // Mon=0..Sun=6
  const todayISO = toISO(dateOnly(new Date()));

  calgrid.innerHTML = '';
  DOW_ES.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    calgrid.appendChild(el);
  });
  for(let i=0;i<leadingBlanks;i++){
    const el = document.createElement('div');
    el.className = 'day empty';
    calgrid.appendChild(el);
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${calYear}-${pad(calMonth+1)}-${pad(day)}`;
    const entry = SCHEDULE[iso];
    const el = document.createElement('div');
    let cls = 'day';
    if(entry && entry[who] === 'LIBRE') cls += ' libre';
    if(iso === todayISO) cls += ' today';
    el.className = cls;
    el.textContent = day;
    calgrid.appendChild(el);
  }
}

document.getElementById('prevMonth').addEventListener('click', ()=>{
  calMonth--;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  calMonth++;
  if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
});
cookCalSel.addEventListener('change', renderCalendar);

document.getElementById('prevDay').addEventListener('click', ()=>{
  if(!LOADED) return;
  const d = new Date(dateInput.value + 'T00:00:00');
  const nd = addDays(d,-1);
  const iso = toISO(nd);
  if(iso >= DATES[0]) dateInput.value = iso;
  render();
});
document.getElementById('nextDay').addEventListener('click', ()=>{
  if(!LOADED) return;
  const d = new Date(dateInput.value + 'T00:00:00');
  const nd = addDays(d,1);
  const iso = toISO(nd);
  if(iso <= DATES[DATES.length-1]) dateInput.value = iso;
  render();
});
dateInput.addEventListener('change', render);
cookSel.addEventListener('change', render);
document.getElementById('refreshBtn').addEventListener('click', loadSchedule);
</script>
